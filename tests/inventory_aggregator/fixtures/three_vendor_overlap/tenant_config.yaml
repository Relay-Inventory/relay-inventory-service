schema_version: 1
tenant_id: "three_vendor_overlap"
timezone: "America/Los_Angeles"
default_currency: "USD"

vendors:
  - vendor_id: "vendor_1"
    inbound:
      type: "local"
    parser:
      format: "csv"
      delimiter: ","
      encoding: "utf-8"
      column_map:
        sku: "SKU"
        quantity_available: "QTY"
        cost: "COST"
        map_price: "MAP"
    buffer_qty: 2
    min_qty_threshold: 1
    cost_adjustment: 0.00
  - vendor_id: "vendor_2"
    inbound:
      type: "local"
    parser:
      format: "csv"
      delimiter: ","
      encoding: "utf-8"
      column_map:
        sku: "SKU"
        quantity_available: "QTY"
        cost: "COST"
        map_price: "MAP"
    buffer_qty: 0
    min_qty_threshold: 0
    cost_adjustment: 0.50
    rules:
      inclusion_condition: "quantity_available > 0"
  - vendor_id: "vendor_3"
    inbound:
      type: "local"
    parser:
      format: "csv"
      delimiter: ","
      encoding: "utf-8"
      column_map:
        sku: "SKU"
        quantity_available: "QTY"
        cost: "COST"
        map_price: "MAP"
    buffer_qty: 5
    min_qty_threshold: 3
    cost_adjustment: -0.25
    margin_floor: 5.00
    rules:
      exclusion_condition: "cost > 500"

pricing:
  base_margin_pct: 0.20
  min_price: 15.00
  shipping_handling_flat: 7.99
  map_policy:
    enforce: true
    map_floor_behavior: "max(price, map_price)"
  rounding:
    mode: "nearest"
    increment: 0.99

merge:
  strategy: "best_offer"
  best_offer:
    sort_by:
      - "in_stock_desc"
      - "lowest_landed_cost"
    landed_cost:
      include_shipping_handling: true
    fallback_lead_time_days: 7

output:
  format: "csv"
  columns:
    - sku
    - available_qty
    - source_vendor_id
    - source_cost
    - vendor_count
    - price
